name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "lts/*", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The "latest" leg is the newest stable release: the aliases "latest" and "node" have
          # resolved to prereleases, so it uses a semver "*", which skips them, and check-latest
          # asks nodejs.org instead of taking the runner's cached Node.
          node-version: ${{ matrix.node == 'latest' && '*' || matrix.node }}
          check-latest: ${{ matrix.node == 'latest' }}
          cache: npm
      - run: npm ci
      - run: npm run ci:local
