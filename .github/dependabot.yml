# Weekly update pull requests for GitHub Actions and npm.
# Each update waits 14 days after its release before it is proposed.
# Neither entry has anything to update until package.json and the CI workflow land with the first code.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
