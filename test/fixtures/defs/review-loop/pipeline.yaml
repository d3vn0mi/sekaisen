format: 1
id: review-loop
title: Draft, check and publish
version: 1
inputs:
  type: object
  properties:
    topic: { type: string }
  required: [topic]
defaults:
  deadline: 30m
  retry: { max: 1, on: [no_result, lost] }
start: draft
stages:
  draft:
    type: agent
    agent: drafter
    session: run
    brief: briefs/draft.md
    outcomes:
      drafted:
        fields: { pr_url: string, summary: "string?" }
        next: check
      blocked:
        fields: { reason: string }
        next: failed
  check:
    type: agent
    agent: checker
    session: run
    brief: briefs/check.md
    deadline: 15m
    turns: { max: 2, cap: 10m }
    outcomes:
      pass: { next: publish }
      fail:
        fields: { findings: string }
        next:
          - { if: "count(check.fail) < 3", to: draft }
          - { to: failed }
  publish:
    type: gate
    who: operator
    prompt: "Publish the draft for {{inputs.topic}}?"
    timeout: 24h
    outcomes:
      approve: { next: done }
      reject: { next: failed }
    on_timeout: { remind: 24h }
  done: { type: end, status: completed }
  failed: { type: end, status: failed }
